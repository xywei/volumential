<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 630" role="img" aria-labelledby="title desc">
  <title id="title">Near-field and far-field split in Volumential (schematic)</title>
  <desc id="desc">Schematic. A five by five block of boxes. The target box in the middle and its eight neighbors are evaluated from a near-field interaction table, including the target box's own, singular interaction; the outer ring of well-separated boxes is handled by the fast multipole method.</desc>
  <rect width="960" height="630" rx="24" fill="#ffffff"/>
  <text x="48" y="58" font-family="system-ui, sans-serif" font-size="30" font-weight="700" fill="#172033">One target, two numerical paths</text>
  <text x="48" y="92" font-family="system-ui, sans-serif" font-size="18" fill="#556070">Schematic: nearby boxes are tabulated, farther boxes stay in the FMM.</text>
  <g transform="translate(60 125)">
    <rect x="0" y="0" width="380" height="380" fill="#edf1f5"/>
    <rect x="76" y="76" width="228" height="228" fill="#fff1cc"/>
    <rect x="152" y="152" width="76" height="76" fill="#5a67d8"/>
    <path d="M76 0v380M152 0v380M228 0v380M304 0v380M0 76h380M0 152h380M0 228h380M0 304h380" fill="none" stroke="#c7ced8" stroke-width="2"/>
    <rect x="1" y="1" width="378" height="378" fill="none" stroke="#c7ced8" stroke-width="2"/>
    <rect x="155" y="155" width="70" height="70" fill="none" stroke="#e3b547" stroke-width="5"/>
    <text x="190" y="187" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#ffffff">target</text>
    <text x="190" y="208" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" fill="#eef0ff">box</text>
  </g>
  <g font-family="system-ui, sans-serif">
    <path d="M448 280 C488 280 500 262 526 262" fill="none" stroke="#d89b18" stroke-width="4"/>
    <polygon points="540,262 524,253 524,271" fill="#d89b18"/>
    <text x="550" y="162" font-size="24" font-weight="700" fill="#9a6b08">Near field</text>
    <text x="550" y="192" font-size="18" fill="#556070">target box and neighbors</text>
    <rect x="550" y="208" width="370" height="112" rx="14" fill="#fff7df" stroke="#e3b547" stroke-width="2"/>
    <text x="735" y="242" text-anchor="middle" font-size="20" font-weight="700" fill="#6c4a05">interaction table</text>
    <text x="735" y="270" text-anchor="middle" font-size="18" fill="#6c4a05">singular-aware quadrature,</text>
    <text x="735" y="296" text-anchor="middle" font-size="18" fill="#6c4a05">reused for every density</text>
    <path d="M448 468 C488 468 500 480 526 480" fill="none" stroke="#778391" stroke-width="4"/>
    <polygon points="540,480 524,471 524,489" fill="#778391"/>
    <text x="550" y="398" font-size="24" font-weight="700" fill="#3b4652">Far field</text>
    <text x="550" y="428" font-size="18" fill="#556070">well-separated boxes</text>
    <rect x="550" y="444" width="370" height="72" rx="14" fill="#f1f4f7" stroke="#b5bec8" stroke-width="2"/>
    <text x="735" y="487" text-anchor="middle" font-size="20" font-weight="700" fill="#35404b">multipole / local expansions</text>
  </g>
  <g font-family="system-ui, sans-serif" font-size="18" fill="#556070">
    <rect x="60" y="545" width="22" height="22" rx="3" fill="#5a67d8" stroke="#e3b547" stroke-width="3"/>
    <text x="94" y="562">target box; its own interaction is tabulated too</text>
    <rect x="60" y="584" width="22" height="22" rx="3" fill="#fff1cc" stroke="#e3b547"/>
    <text x="94" y="601">table lookup</text>
    <rect x="260" y="584" width="22" height="22" rx="3" fill="#edf1f5" stroke="#c7ced8"/>
    <text x="294" y="601">FMM (multipole and local expansions)</text>
  </g>
</svg>
