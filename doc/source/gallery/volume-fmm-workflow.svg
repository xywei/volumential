<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 445" role="img" aria-labelledby="title desc">
  <title id="title">Volumential volume FMM workflow (schematic)</title>
  <desc id="desc">Schematic. The source density is sampled at volume quadrature nodes and organized into a tree with its traversal. The computation splits into a near-field path, a precomputed table lookup, and a far-field path, ordinary FMM expansions; the two add up to the potential at the quadrature nodes, which is interpolated to other targets.</desc>
  <rect width="1120" height="445" rx="24" fill="#ffffff"/>
  <text x="48" y="54" font-family="system-ui, sans-serif" font-size="30" font-weight="700" fill="#172033">From a source density to a volume potential</text>
  <text x="48" y="88" font-family="system-ui, sans-serif" font-size="20" fill="#556070">Schematic: only near interactions leave the ordinary particle FMM path.</text>
  <g font-family="system-ui, sans-serif" text-anchor="middle">
    <rect x="30" y="173" width="210" height="130" rx="18" fill="#eef4ff" stroke="#8ba8e8" stroke-width="2"/>
    <text x="135" y="215" font-size="21" font-weight="700" fill="#27457f">Source density</text>
    <text x="135" y="247" font-size="20" fill="#52698f">f(y) at the</text>
    <text x="135" y="273" font-size="20" fill="#52698f">quadrature nodes</text>
    <rect x="275" y="173" width="225" height="130" rx="18" fill="#f3f1ff" stroke="#a399df" stroke-width="2"/>
    <text x="387.5" y="215" font-size="21" font-weight="700" fill="#4c438c">Tree + traversal</text>
    <text x="387.5" y="247" font-size="20" fill="#625a90">adaptive 2:1 boxes</text>
    <text x="387.5" y="273" font-size="20" fill="#625a90">interaction lists</text>
    <rect x="560" y="118" width="270" height="110" rx="18" fill="#fff7df" stroke="#e3b547" stroke-width="2"/>
    <text x="695" y="152" font-size="21" font-weight="700" fill="#7a5407">Near field</text>
    <text x="695" y="182" font-size="20" fill="#7a650e">precomputed</text>
    <text x="695" y="208" font-size="20" fill="#7a650e">table lookup</text>
    <rect x="560" y="248" width="270" height="110" rx="18" fill="#f1f4f7" stroke="#b5bec8" stroke-width="2"/>
    <text x="695" y="282" font-size="21" font-weight="700" fill="#35404b">Far field</text>
    <text x="695" y="312" font-size="20" fill="#556070">multipole and local</text>
    <text x="695" y="338" font-size="20" fill="#556070">expansions</text>
    <rect x="875" y="153" width="225" height="170" rx="18" fill="#eaf8f1" stroke="#72bd96" stroke-width="2"/>
    <text x="987.5" y="187" font-size="21" font-weight="700" fill="#216b48">Potential</text>
    <text x="987.5" y="219" font-size="20" fill="#3e765e">near + far, at the</text>
    <text x="987.5" y="245" font-size="20" fill="#3e765e">quadrature nodes;</text>
    <text x="987.5" y="271" font-size="20" fill="#3e765e">interpolated to</text>
    <text x="987.5" y="297" font-size="20" fill="#3e765e">other targets</text>
  </g>
  <g fill="none" stroke="#7b8794" stroke-width="4">
    <path d="M240 238h22"/>
    <path d="M500 238 C530 238 530 173 547 173"/>
    <path d="M500 238 C530 238 530 303 547 303"/>
    <path d="M830 173 C855 173 850 225 862 225"/>
    <path d="M830 303 C855 303 850 251 862 251"/>
  </g>
  <g fill="#7b8794">
    <polygon points="275,238 261,229 261,247"/>
    <polygon points="560,173 546,164 546,182"/>
    <polygon points="560,303 546,294 546,312"/>
    <polygon points="875,225 861,216 861,234"/>
    <polygon points="875,251 861,242 861,260"/>
  </g>
  <rect x="88" y="382" width="944" height="42" rx="21" fill="#f8fafc"/>
  <text x="560" y="410" text-anchor="middle" font-family="system-ui, sans-serif" font-size="19" fill="#556070">Tables depend on the geometry, kernel and order, not on the source density.</text>
</svg>
