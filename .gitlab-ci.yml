variables:
  PYOPENCL_CTX: "portable:0"
  PYOPENCL_TEST: "portable:0"

Flake8:
    script:
    - curl -L -O -k https://gitlab.tiker.net/inducer/ci-support/raw/master/prepare-and-run-flake8.sh
    - ". ./prepare-and-run-flake8.sh volumential test examples"
    tags:
    - python3
    except:
    - tags

Python 3 POCL:
  script:
  - export PY_EXE=python3
  - export PYOPENCL_TEST=portable:pthread
  - export EXTRA_INSTALL="pybind11 cython numpy pytest pytest-cov scipy mako wheel"
  - export PYTEST_FLAGS="--cov=volumential"
  - curl -L -O -k https://gitlab.tiker.net/inducer/ci-support/raw/master/build-and-test-py-project.sh
  - sed -i -e '/^TESTABLES=.*/i PIP="${PY_EXE} $(which pip)" \n$PIP uninstall -y pytest-warnings' build-and-test-py-project.sh
  - ". ./build-and-test-py-project.sh"
  tags:
  - python3
  - pocl
  - dealii
  except:
  - tags
  artifacts:
    reports:
      junit: test/pytest.xml

Python 3 Intel:
  variables:
    PYOPENCL_CTX: "intel(r):pu"
    PYOPENCL_TEST: "intel(r):pu"
  rules:
  - if: '$RUN_INTEL_CI == "1"'
    when: on_success
  - if: '$CI_COMMIT_REF_NAME =~ /^test\/.*/'
    when: on_success
  - when: never
  script:
  - export PY_EXE=python3
  - source /opt/enable-intel-cl.sh
  - export PYTEST_FLAGS="--cov=volumential"
  - export EXTRA_INSTALL="pybind11 cython numpy pytest pytest-cov scipy mako wheel"
  - curl -L -O -k https://gitlab.tiker.net/inducer/ci-support/raw/master/build-and-test-py-project.sh
  - sed -i -e '/^TESTABLES=.*/i PIP="${PY_EXE} $(which pip)" \n$PIP uninstall -y pytest-warnings' build-and-test-py-project.sh
  - ". ./build-and-test-py-project.sh"
  tags:
  - python3
  - intel-cl-cpu
  - dealii
  artifacts:
    reports:
      junit: test/pytest.xml

Python 3 Conda:
  script:
  - export SUMPY_FORCE_SYMBOLIC_BACKEND=symengine
  - export CONDA_ENVIRONMENT=.test-conda-env-py3.yml
  - export PYTEST_FLAGS="--cov=volumential"
  - curl -L -O -k https://gitlab.tiker.net/inducer/ci-support/raw/main/ci-support.sh
  - source ci-support.sh
  - build_py_project_in_conda_env
  - test_py_project
  tags:
  - linux
  except:
  - tags
  artifacts:
    reports:
      junit: test/pytest.xml

Python 3 Conda Apple:
  script:
  - export LC_ALL=en_US.UTF-8
  - export LANG=en_US.UTF-8
  - export CONDA_ENVIRONMENT=.test-conda-env-py3-macos.yml
  - export CC=clang
  - export PYTEST_FLAGS="--cov=volumential"
  - set -o xtrace
  - curl -L -O -k https://gitlab.tiker.net/inducer/ci-support/raw/main/ci-support.sh
  - source ci-support.sh
  - build_py_project_in_conda_env
  - test_py_project
  tags:
  - apple
  except:
  - tags
  artifacts:
    reports:
      junit: test/pytest.xml
  allow_failure: true

Python 3 Conda Examples:
  script:
  - export CONDA_ENVIRONMENT=.test-conda-env-py3.yml
  - rm -f examples/*.hdf5
  - curl -L -O -k https://gitlab.tiker.net/inducer/ci-support/raw/main/ci-support.sh
  - source ci-support.sh
  - build_py_project_in_conda_env
  - run_examples
  tags:
  - python3
  - pocl
  except:
  - tags
  artifacts:
    reports:
      junit: test/pytest.xml

# The "Documentation Sphinx" job that used to live here is retired.  It built
# the site and force-pushed the result into a personal homepage repository over
# a token -- the mechanism behind the build the README still links to.  Its
# replacements are in GitHub Actions, where the rest of CI already lives:
# .github/workflows/ci.yml builds the site, checks its links and reports its
# coverage on every pull request, and .github/workflows/docs-pages.yml deploys
# it to GitHub Pages from main once Pages is enabled for the repository.  See
# xywei/volumential#145.
