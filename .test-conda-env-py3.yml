name: test-conda-env-py3
channels:
  - conda-forge
  - nodefaults
dependencies:
  - attrs
  - cgen
  - cmake
  - colorama
  - cython
  # For the source build of pyfmmlib that the ``fmmlib`` extra pulls in:
  # the extra pins pyfmmlib to a Git commit, so ``Testing (Linux)`` and the
  # dependency-heads job of ``CI Full`` build it.  ``fortran-compiler`` is
  # the conda-forge metapackage that installs gfortran, which has OpenMP,
  # together with its activation scripts, so ``FC`` is already set inside
  # ``micromamba-shell``; meson-python and ninja come from build isolation.
  - fortran-compiler
  - genpy
  - git
  - iniconfig
  - islpy
  - matplotlib-base
  - numpy
  - packaging
  - pluggy
  - pocl
  # The release build, for the jobs that install no extra beyond ``test``;
  # 2026.1 and later carry the batched ``*formmp_imany`` wrappers and the
  # OpenMP option.  The jobs that install the ``fmmlib`` extra replace it
  # with the build of the pinned commit, which is what a user of the extra
  # gets, and check that they did.
  - pyfmmlib
  # Older than the floor in pyproject.toml (conda-forge has no 2026.1.4), so
  # every job's install replaces it with PyPI's wheel.  That wheel's ICD
  # loader reads /etc/OpenCL/vendors unless OCL_ICD_VENDORS names another
  # directory, so the jobs that run OpenCL point it at this environment's.
  - pyopencl
  - pyrsistent
  - pytest
  - pytest-cov
  - python-symengine
  - python=3.12
  - pyvkfft
  - scipy
  - symengine
  - sympy
  - pip
  - uv
