name: test-conda-env-py3
channels:
  - conda-forge
  - nodefaults
dependencies:
  - attrs
  - cgen
  - cmake
  - colorama
  - cython
  - genpy
  - git
  - iniconfig
  - islpy
  - matplotlib-base
  - numpy
  - packaging
  - pluggy
  - pocl
  # 2026.1 and later carry the batched ``*formmp_imany`` wrappers and the
  # OpenMP option.  The ``fmmlib`` extra that ``Testing (Linux)`` installs
  # asks for that version, so it keeps this build, and only replaces an older
  # one with the PyPI wheel; it needs no Fortran compiler for either.
  - pyfmmlib
  - pyopencl
  - pyrsistent
  - pytest
  - pytest-cov
  - python-symengine
  - python=3.12
  - pyvkfft
  - scipy
  - symengine
  - sympy
  - pip
  - uv
