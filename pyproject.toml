[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "volumential"
version = "2017.1a0"
description = "Volume potential computation powered by FMM."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE.md"]
authors = [
  { name = "Xiaoyu Wei", email = "wxy0516@gmail.com" },
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Natural Language :: English",
  "Programming Language :: Python",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Information Analysis",
  "Topic :: Scientific/Engineering :: Mathematics",
  "Topic :: Scientific/Engineering :: Visualization",
  "Topic :: Software Development :: Libraries",
  "Topic :: Utilities",
]
dependencies = [
  "arraycontext @ git+https://github.com/inducer/arraycontext.git@4ed685da024473266b2a635b350615e36c3ce176",
  "boxtree @ git+https://github.com/inducer/boxtree.git@82a86d8c0701cd1aa4c1596365ad4206a212c5d2",
  "loopy @ git+https://github.com/inducer/loopy.git@8807bdd42344ef619106866f8f41908e1a461a6f",
  "meshmode @ git+https://github.com/inducer/meshmode.git@fa2d5450a42468ef31b9b8f420e2514465ba7a5c",
  "modepy @ git+https://github.com/inducer/modepy.git@a0f44097f4f470c9107c60ef322512ecabda1174",
  "pymbolic @ git+https://github.com/inducer/pymbolic.git@3963dd2d0be04e3f06ce7b5d1151dff3955ff5aa",
  "pyopencl",
  "pytools @ git+https://github.com/inducer/pytools.git@295ffaebfacdb1ffb2a7ef85a0862f3ee0519c8f",
  "pytential @ git+https://github.com/inducer/pytential.git@09a0316b88ddb3fd75670089dc64411186740606",
  "scipy",
  "sumpy @ git+https://github.com/inducer/sumpy.git@019e780a31113af35a823e0178e032b4d70ebdbc",
]

[project.optional-dependencies]
benchmark = ["mpmath"]
fmmlib = ["pyfmmlib>=2026.1"]
gmsh_support = [
  "gmsh_interop @ git+https://github.com/inducer/gmsh_interop.git@0250c1eff69bf17b2d1e9b296163f2aef5cdbda5",
]
test = [
  "filelock",
  "gmsh_interop @ git+https://github.com/inducer/gmsh_interop.git@0250c1eff69bf17b2d1e9b296163f2aef5cdbda5",
  "pytest",
]
doc = [
  "interrogate",
  "myst-nb",
  "myst-parser",
  "pydata-sphinx-theme",
  "sphinx",
  "sphinx-autobuild",
  "sphinx-copybutton",
  "sphinx-design",
  "sphinx-sitemap",
  "sphinxext-opengraph",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["volumential*"]

[tool.uv]
default-groups = []

[tool.interrogate]
# The docstring half of the documentation coverage question; the module and
# object half is ``sphinx-build -b coverage`` (see ``doc/source/conf.py``).
# ``interrogate volumential`` prints the percentage of the public surface that
# carries a docstring, and ``-v`` lists the objects that do not.
#
# What counts as public here is what the API reference means by it: a name with
# an underscore-prefixed component is not on a page, so it is not counted, and
# neither is ``__init__`` (documented by its class) or a nested helper.
ignore-init-method = true
ignore-magic = true
ignore-private = true
ignore-semiprivate = true
ignore-nested-functions = true
exclude = [
  # A 2019 finite-element experiment that nothing in the tree imports; the API
  # reference leaves it out too.
  "volumential/qbfem",
  "doc",
  "examples",
  "test",
]
# A ratchet, not a target: the tree measures 91.53% today (389 of 425), and
# 91.5 is that truncated to the tenth.  The decimal is load-bearing -- a
# whole-number threshold would leave several objects of slack, because
# interrogate rounds the measured percentage to as many decimals as the
# threshold carries before comparing, and one new gap here costs 0.24 points.
# At 91.5 a single new undocumented public object (91.29%, rounded to 91.3)
# fails the check.  Raise the number in the commit that earns it; lowering it
# is a deliberate edit that has to say why.
#
# The 36 that are missing today are 30 module docstrings and six objects: the
# five Duffy quadrature kernels of ``NearFieldInteractionTable``, whose
# contract cannot be read off the source, and the setter half of its ``data``
# property, documented on the getter.
fail-under = 91.5
verbose = 1

[tool.pytest.ini_options]
testpaths = ["test"]
markers = [
  "full_accuracy: high-cost accuracy and fp64 regression tests, skipped unless --full-accuracy",
]

[tool.basedpyright]
include = ["volumential/version.py"]
exclude = ["test", "examples"]
typeCheckingMode = "basic"
failOnWarnings = false
reportMissingImports = "none"
reportMissingTypeStubs = "none"
reportUnknownVariableType = "none"
reportUnknownMemberType = "none"
reportUnknownArgumentType = "none"
reportUnknownParameterType = "none"
reportUnknownLambdaType = "none"
reportAny = "none"
reportUnusedCallResult = "none"
reportUnusedImport = "none"
