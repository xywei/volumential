[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "volumential"
version = "2017.1a0"
description = "Volume potential computation powered by FMM."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE.md"]
authors = [
  { name = "Xiaoyu Wei", email = "wxy0516@gmail.com" },
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Natural Language :: English",
  "Programming Language :: Python",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Information Analysis",
  "Topic :: Scientific/Engineering :: Mathematics",
  "Topic :: Scientific/Engineering :: Visualization",
  "Topic :: Software Development :: Libraries",
  "Topic :: Utilities",
]
dependencies = [
  "arraycontext",
  "boxtree",
  "loopy",
  "meshmode",
  "modepy",
  "pymbolic",
  "pyopencl",
  "pytools",
  "pytential",
  "scipy",
  "sumpy",
]

[project.optional-dependencies]
benchmark = ["mpmath"]
fmmlib = ["pyfmmlib>=2024.1"]
gmsh_support = ["gmsh_interop"]
test = ["filelock", "gmsh_interop", "pytest"]
doc = [
  "interrogate",
  "myst-nb",
  "myst-parser",
  "pydata-sphinx-theme",
  "sphinx",
  "sphinx-autobuild",
  "sphinx-copybutton",
  "sphinx-design",
  "sphinx-sitemap",
  "sphinxext-opengraph",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["volumential*"]

[tool.uv]
default-groups = []

[tool.uv.sources]
arraycontext = { git = "https://github.com/inducer/arraycontext.git" }
boxtree = { git = "https://github.com/inducer/boxtree.git" }
cgen = { git = "https://github.com/inducer/cgen.git" }
genpy = { git = "https://github.com/inducer/genpy.git" }
gmsh_interop = { git = "https://github.com/inducer/gmsh_interop.git" }
loopy = { git = "https://github.com/inducer/loopy.git" }
meshmode = { git = "https://github.com/inducer/meshmode.git" }
modepy = { git = "https://github.com/inducer/modepy.git" }
pyfmmlib = { git = "https://github.com/inducer/pyfmmlib.git" }
pymbolic = { git = "https://github.com/inducer/pymbolic.git" }
pytential = { git = "https://github.com/inducer/pytential.git" }
pytools = { git = "https://github.com/inducer/pytools.git" }
pyvisfile = { git = "https://github.com/inducer/pyvisfile.git" }
sumpy = { git = "https://github.com/inducer/sumpy.git" }

[tool.interrogate]
# The docstring half of the documentation coverage question; the module and
# object half is ``sphinx-build -b coverage`` (see ``doc/source/conf.py``).
# ``interrogate volumential`` prints the percentage of the public surface that
# carries a docstring, and ``-v`` lists the objects that do not.
#
# What counts as public here is what the API reference means by it: a name with
# an underscore-prefixed component is not on a page, so it is not counted, and
# neither is ``__init__`` (documented by its class) or a nested helper.
ignore-init-method = true
ignore-magic = true
ignore-private = true
ignore-semiprivate = true
ignore-nested-functions = true
exclude = [
  # A 2019 finite-element experiment that nothing in the tree imports; the API
  # reference leaves it out too.
  "volumential/qbfem",
  "benchmarks",
  "doc",
  "examples",
  "test",
]
# A ratchet, not a target: 91 is 91.5% -- what the tree measures today --
# rounded down, so a new undocumented public object fails the check.  Raise it
# in the commit that earns it; lowering it is a deliberate edit that has to say
# why.  The 36 that are missing today are 30 module docstrings and six objects:
# the five Duffy quadrature kernels of ``NearFieldInteractionTable``, whose
# contract cannot be read off the source, and the setter half of its ``data``
# property, documented on the getter.
fail-under = 91
verbose = 1

[tool.pytest.ini_options]
testpaths = ["test"]
markers = [
  "full_accuracy: high-cost derivative accuracy tests, skipped unless --full-accuracy",
]

[tool.basedpyright]
include = ["volumential/version.py"]
exclude = ["test", "examples"]
typeCheckingMode = "basic"
failOnWarnings = false
reportMissingImports = "none"
reportMissingTypeStubs = "none"
reportUnknownVariableType = "none"
reportUnknownMemberType = "none"
reportUnknownArgumentType = "none"
reportUnknownParameterType = "none"
reportUnknownLambdaType = "none"
reportAny = "none"
reportUnusedCallResult = "none"
reportUnusedImport = "none"
