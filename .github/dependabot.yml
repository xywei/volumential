# Keeps the SHA-pinned GitHub Actions in .github/workflows/*.yml current.
# Every `uses:` there is pinned to a full commit SHA with the release tag as a
# trailing comment; Dependabot updates both together, so the pins never freeze.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: "ci(deps)"
