name: Docs Pages

# Builds the documentation site from ``main`` and publishes it to GitHub Pages
# at https://xywei.github.io/volumential/ .
#
# Pages has been enabled for the repository since 2026-09-13 (Settings ->
# Pages -> Build and deployment -> Source: "GitHub Actions"), a setting the
# repository owner controls, not this workflow: publishing changes a public
# surface, so the workflow never enables Pages for itself
# (``actions/configure-pages`` with ``enablement: true`` would, and needs a
# token beyond GITHUB_TOKEN).  Should the setting ever be turned off, the
# ``build`` job still succeeds and the ``deploy`` job fails with "Get Pages
# site failed"; nothing else in CI is affected.
#
# The site is what doc/source/conf.py's ``html_baseurl`` and the version
# switcher's absolute ``json_url`` name, and what README.md and the repository
# homepage link to.  See xywei/volumential#145.

on:
  push:
    branches: [ 'main' ]
  # Manual runs exist for republishing without a new commit on main (the
  # first publication on 2026-09-13 was one).  ``workflow_dispatch``
  # takes a ref, though, and a dispatch from a branch or a tag would otherwise
  # publish that ref to the production site; both jobs below are guarded
  # against it.
  workflow_dispatch:

# Read-only by default.  The two grants a Pages deployment needs --
# ``pages: write`` to create the deployment and ``id-token: write`` for the
# OIDC token ``actions/deploy-pages`` exchanges for it -- are on the ``deploy``
# job alone, so the job that runs the build (and with it every dependency's
# setup code) cannot reach the Pages API or mint a token.
permissions:
  contents: read

# One deployment at a time, and never cancel one in flight: a cancelled deploy
# can leave the site half-updated.  Deliberately a single "pages" group rather
# than the per-ref group the other workflows use, so that two pushes to main in
# quick succession queue instead of racing.
concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build:
    name: Build
    # main only.  The site has one published version, so a dispatch from any
    # other ref must not reach it; a skipped build also skips ``deploy``,
    # which needs it.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: mamba-org/setup-micromamba@f457c30a868e4760d3a6fcea5f25dc655b8edf39 # v3.2.1
        with:
          environment-file: .test-conda-env-py3.yml
          environment-name: testing
          cache-downloads: true
          generate-run-shell: true
      - name: Prepare Documentation Environment
        shell: micromamba-shell {0}
        run: |
          set -euxo pipefail

          export PY_EXE=python

          python -m pip install --upgrade pip
          python -m pip install uv
          uv pip install --system --editable ".[test,doc]"

      # The same command the ``Documentation`` job of CI runs, so that what is
      # published is what the pull request's preview artifact showed.  The link
      # check and the coverage reports stay in CI: they gate a change, and a
      # third-party host going down should not block a deployment of pages that
      # already passed them.
      - name: Build the site
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail

          sphinx-build -W --keep-going -n -b html doc/source doc/build/html

      - name: Upload the site as a Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: doc/build/html/

  deploy:
    name: Deploy
    needs: build
    # Stated again rather than inherited, so that the guarantee survives an
    # edit to ``needs``.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

