name: Publish

# A tag v<version> makes a GitHub Release of that version, with the sdist and
# the wheel attached. A release is installed from its tag:
#
#   pip install "volumential @ git+https://github.com/xywei/volumential@v<version>"
#
# It is not uploaded to PyPI, which rejects any distribution whose metadata
# has a direct reference (name @ git+https://...), pinned or not, in an extra
# or not. Volumential's inducer dependencies are only usable from Git, so
# pyproject.toml pins them as direct references (#211).
#
# The PyPI project keeps its Trusted Publisher for this workflow (owner xywei,
# repository volumential, workflow publish.yml, no environment), so keep the
# file name. Switching back to PyPI means plain-name dependencies, once the
# inducer packages Volumential needs are released there (#211), and a job
# that downloads the distributions and runs pypa/gh-action-pypi-publish with
# id-token: write on that job alone, as this one did before.
#
# Building and releasing are two jobs. The build runs third-party code (pip,
# the setuptools backend and what they pull in) with read access only; the
# release job, the only one allowed to write to the repository, runs no
# checkout and no build, only the upload of what the build produced.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The build runs third-party code, which has no use for a Git token.
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      # A tag publishes the version the package says it is, so the two have to
      # be the same: v2026.1 for version 2026.1 in pyproject.toml and in
      # volumential.version.VERSION_TEXT. The module is read, not imported,
      # since importing it needs volumential's dependencies. A tag that is not
      # the version stops here, before anything is built, and no release is
      # made.
      - name: Check that the tag is the package's version
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          project=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          module=$(python - <<'EOF'
          import ast
          values = {}
          for node in ast.parse(open("volumential/version.py").read()).body:
              if isinstance(node, ast.Assign) and len(node.targets) == 1:
                  name = getattr(node.targets[0], "id", None)
                  if name in ("VERSION", "VERSION_STATUS"):
                      values[name] = ast.literal_eval(node.value)
          print(".".join(str(i) for i in values["VERSION"]) + values["VERSION_STATUS"])
          EOF
          )
          echo "tag ${GITHUB_REF_NAME}, pyproject.toml ${project}, volumential.version ${module}"
          if [[ "${tag}" != "${project}" || "${tag}" != "${module}" ]]; then
            echo "the tag ${GITHUB_REF_NAME} is not the package's version: pyproject.toml has ${project}, volumential.version ${module}" >&2
            exit 1
          fi

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build

      # What was built is what the tag names, one sdist and one wheel, and
      # their metadata is valid and its README renders, as PyPI would check.
      - name: Check the distributions
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          ls dist
          test -f "dist/volumential-${tag}.tar.gz"
          test -f "dist/volumential-${tag}-py3-none-any.whl"
          test "$(ls dist | wc -l)" -eq 2
          python -m twine check --strict dist/*

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7

  release:
    name: GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      # To create the release and attach the files, and given to this job only.
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: distributions
          path: dist/

      # No checkout, so gh is told the repository. --verify-tag stops the
      # release if the tag is gone rather than letting gh create one. A
      # version with a pre-release segment (2026.1a1, 2026.1rc1) is marked
      # as a pre-release.
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          prerelease=()
          if [[ "${version}" =~ (a|b|rc)[0-9]+$ ]]; then
            prerelease=(--prerelease)
          fi
          cat > notes.md <<EOF
          Install this release with

          \`\`\`bash
          pip install "volumential @ git+https://github.com/${GITHUB_REPOSITORY}@${GITHUB_REF_NAME}"
          \`\`\`

          or \`uv pip install\` with the same argument. Its metadata pins the
          inducer packages it depends on to Git commits, so the install needs
          \`git\`, and a C compiler for the extension pytential builds; to run,
          it needs an OpenCL runtime, such as conda-forge's \`pocl\`. The sdist
          and the wheel attached here carry the same pins.

          Changes: https://xywei.github.io/volumential/changelog.html
          EOF
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --title "volumential ${version}" \
            --notes-file notes.md \
            "${prerelease[@]}"
