name: CI Full
on:
  push:
    branches: [ 'main' ]
  schedule:
    - cron: '17 3 * * 0'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  PYOPENCL_CTX: 'portable:0'
  PYOPENCL_TEST: 'portable:0'

jobs:
  pytest_mac:
    name: Testing (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: mamba-org/setup-micromamba@f457c30a868e4760d3a6fcea5f25dc655b8edf39 # v3.2.1
        with:
          environment-file: .test-conda-env-py3-macos.yml
          environment-name: testing
          cache-downloads: true
          generate-run-shell: true
      # These two steps localized xywei/volumential#158 (the platform was
      # PoCL 3.1 and the abort was the final link of the first kernel; see
      # the comment on ``pocl`` in .test-conda-env-py3-macos.yml) and stay
      # as a cheap preflight: the inventory names the platform and version
      # the solve produced, and the one-kernel build separates a platform
      # crash from a kernel-compilation or link crash before the test run
      # can hide either.  ``continue-on-error`` keeps them diagnostic:
      # neither may change this job's verdict.
      - name: OpenCL platform inventory (diagnostic)
        shell: micromamba-shell {0}
        continue-on-error: true
        env:
          POCL_DEBUG: warning
        run: |
          python - <<'PYEOF'
          import traceback

          import pyopencl as cl

          for platform in cl.get_platforms():
              # Name the platform *before* enumerating it, and flush: if
              # get_devices() is what aborts, a print that evaluates the
              # device list first never reaches the log, and buffered output
              # from earlier platforms is lost with the process.
              print(platform.name, platform.version, flush=True)
              try:
                  for device in platform.get_devices():
                      print("   ", device.name, device.type, device.version,
                            flush=True)
              except Exception:
                  traceback.print_exc()
          PYEOF
      - name: Compile and run one OpenCL kernel per CPU device (diagnostic)
        shell: micromamba-shell {0}
        continue-on-error: true
        env:
          POCL_DEBUG: warning
        run: |
          python - <<'PYEOF'
          import traceback

          import numpy as np
          import pyopencl as cl
          import pyopencl.array as cla

          source = "kernel void k(global double *y){y[get_global_id(0)]=1.0;}"
          for platform in cl.get_platforms():
              print(f"=== {platform.name!r}", flush=True)
              # A platform whose ICD is present but unusable raises here,
              # before the per-device try below; letting that end the step
              # would hide every later platform, the Portable one the main
              # test run selects included.
              try:
                  devices = platform.get_devices()
              except Exception:
                  traceback.print_exc()
                  continue
              for device in devices:
                  if not device.type & cl.device_type.CPU:
                      continue
                  print(f"--- {platform.name!r} / {device.name!r}", flush=True)
                  # A Python exception is a finding, not a reason to stop:
                  # the next device may be the one that aborts, and only the
                  # abort itself should end this step.
                  try:
                      ctx = cl.Context([device])
                      queue = cl.CommandQueue(ctx)
                      print("    building", flush=True)
                      program = cl.Program(ctx, source).build()
                      print("    built", flush=True)
                      y = cla.zeros(queue, 4, np.float64)
                      program.k(queue, y.shape, None, y.data)
                      queue.finish()
                      print(f"    ran -> {y.get()}", flush=True)
                  except Exception:
                      traceback.print_exc()
          PYEOF
      - name: Main Script
        shell: micromamba-shell {0}
        run: |
          export PY_EXE=python
          export LC_ALL=en_US.UTF-8
          export LANG=en_US.UTF-8
          export PYOPENCL_CTX="portable:0"

          export PYTEST_FLAGS="--cov=volumential"
          export CISUPPORT_PARALLEL_PYTEST=no
          export CI_TEST_CONDA_PREFIX="$CONDA_PREFIX"
          export CPATH="${CI_TEST_CONDA_PREFIX}/include${CPATH:+:${CPATH}}"
          export LIBRARY_PATH="${CI_TEST_CONDA_PREFIX}/lib${LIBRARY_PATH:+:${LIBRARY_PATH}}"
          export CPPFLAGS="${CPPFLAGS:-} -I${CI_TEST_CONDA_PREFIX}/include"
          export CFLAGS="${CFLAGS:-} -I${CI_TEST_CONDA_PREFIX}/include"
          export LDFLAGS="${LDFLAGS:-} -L${CI_TEST_CONDA_PREFIX}/lib"

          python -m pip install --upgrade pip
          python -m pip install uv
          uv pip install --system --editable ".[test]"

          curl -L -O https://tiker.net/ci-support-v0
          . ./ci-support-v0

          test_py_project

  # The ``Documentation`` job moved to .github/workflows/ci.yml.  It is the
  # same build plus a link check and an HTML artifact, and it runs where it is
  # useful: on pull requests, which this workflow has no trigger for, and on
  # pushes to main and the weekly schedule, which that workflow also has.
  # Running it in both places would only build the site twice on main.  The
  # published site is a third build, in .github/workflows/docs-pages.yml.

  full_accuracy:
    name: Full Accuracy Tests
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: mamba-org/setup-micromamba@f457c30a868e4760d3a6fcea5f25dc655b8edf39 # v3.2.1
        with:
          environment-file: .test-conda-env-py3.yml
          environment-name: testing
          cache-downloads: true
          generate-run-shell: true
      - name: Main Script
        shell: micromamba-shell {0}
        run: |
          set -euxo pipefail

          export PY_EXE=python
          # The fp64 tests build their context from PYOPENCL_CTX (see
          # test/_opencl_test_utils.py), so this is the device they run on:
          # the PoCL CPU.  Before they honoured it they looked for an fp64
          # GPU, found none on this runner, and all of them skipped.
          export PYOPENCL_CTX="portable:0"
          export PYOPENCL_TEST="portable:0"
          export PYTHONFAULTHANDLER=1
          # At full size the two 3D split-versus-nonsplit tests took 57 of
          # the 90 minutes this run needed on the CPU; this runs them at the
          # reduced size of _split_3d_full_accuracy_size in
          # test/test_volume_fmm.py.  Leave it unset for the full size.
          export VOLUMENTIAL_FULL_ACCURACY_REDUCED=1

          python -m pip install --upgrade pip
          python -m pip install uv
          uv pip install --system --editable ".[benchmark,test]"

          # Name the device in the log, and stop before the long run if it
          # is not the fp64 PoCL CPU.
          python - <<'PYEOF'
          import sys

          sys.path.insert(0, "test")

          import pyopencl as cl
          from _opencl_test_utils import create_fp64_context_or_skip

          (device,) = create_fp64_context_or_skip().devices
          print(f"fp64 tests run on {device.name!r} "
                f"on {device.platform.name!r}", flush=True)
          if not (device.type & cl.device_type.CPU
                  and "portable" in device.platform.name.lower()):
              raise SystemExit("PYOPENCL_CTX does not select the PoCL CPU")
          PYEOF

          FULL_ACCURACY_TESTS=(
            test/test_duffy_full_accuracy.py
            test/test_volume_fmm.py
          )
          pytest -vv --collect-only -m full_accuracy --full-accuracy \
            "${FULL_ACCURACY_TESTS[@]}"

          pytest -vv -rs -m full_accuracy --full-accuracy \
            --junitxml=full-accuracy.xml "${FULL_ACCURACY_TESTS[@]}"

          # A skipped accuracy test is not a validated one.
          python - <<'PYEOF'
          import xml.etree.ElementTree as ET

          root = ET.parse("full-accuracy.xml").getroot()
          suites = [root] if root.tag == "testsuite" else root.iter("testsuite")
          skipped = sum(int(suite.get("skipped", 0)) for suite in suites)
          if skipped:
              raise SystemExit(f"{skipped} full-accuracy tests were skipped")
          PYEOF

  examples:
    name: Examples
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: mamba-org/setup-micromamba@f457c30a868e4760d3a6fcea5f25dc655b8edf39 # v3.2.1
        with:
          environment-file: .test-conda-env-py3.yml
          environment-name: testing
          cache-downloads: true
          generate-run-shell: true
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            nft_laplace3d.sqlite
            examples/nft_laplace3d.sqlite
          key: laplace3d-table-cache-static-v1
      - name: Main Script
        shell: micromamba-shell {0}
        run: |
          export PY_EXE=python
          export PYOPENCL_CTX="portable:0"

          python -m pip install --upgrade pip
          python -m pip install uv
          uv pip install --system --editable ".[test]"

          curl -L -O https://tiker.net/ci-support-v0
          . ./ci-support-v0

          run_examples

# vim: sw=2
