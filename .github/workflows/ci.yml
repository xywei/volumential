name: CI
on:
  push:
    branches: [ 'main' ]
  schedule:
    - cron: '17 3 * * 0'
  pull_request:
    branches: [ 'main' ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  PYOPENCL_CTX: 'portable:0'
  PYOPENCL_TEST: 'portable:0'

jobs:
  typos:
    name: Typos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: crate-ci/typos@00f422f3b19c57bc6338715ebfe3316d38768461 # v1.50.3
        with:
          config: .typos.toml
          files: |
            .github/workflows
            volumential
            scripts
            README.md
            DEVELOPMENT.md
            pyproject.toml

  ruff:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Main Script
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff
          ruff check --select E9,F63,F7,F82

  lock:
    name: Lock
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      # pyproject.toml pins the Git dependencies and uv.lock records the same
      # commits.  A pin edited without a relock would leave ``uv sync``
      # installing other commits than the ones a release installs and the
      # other jobs test; scripts/bump_git_pins.py moves a pin and relocks.
      - name: Check that uv.lock agrees with pyproject.toml
        run: |
          python -m pip install uv
          uv lock --check

  basedpyright:
    name: Type Checking (basedpyright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: mamba-org/setup-micromamba@f457c30a868e4760d3a6fcea5f25dc655b8edf39 # v3.2.1
        with:
          environment-file: .test-conda-env-py3.yml
          environment-name: testing
          cache-downloads: true
          generate-run-shell: true
      - name: Main Script
        shell: micromamba-shell {0}
        run: |
          export PY_EXE=python

          python -m pip install --upgrade pip
          python -m pip install uv
          uv pip install --system --editable ".[test]"
          uv pip install --system basedpyright

          python -m basedpyright -p pyproject.toml --level error

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: mamba-org/setup-micromamba@f457c30a868e4760d3a6fcea5f25dc655b8edf39 # v3.2.1
        with:
          environment-file: .test-conda-env-py3.yml
          environment-name: testing
          cache-downloads: true
          generate-run-shell: true
      - name: Prepare Documentation Environment
        shell: micromamba-shell {0}
        run: |
          set -euxo pipefail

          export PY_EXE=python

          python -m pip install --upgrade pip
          python -m pip install uv
          uv pip install --system --editable ".[test,doc]"

      # The build imports volumential, hence the micromamba environment: the
      # OpenCL stack (pyopencl, loopy) has to be importable even though no
      # device is used.
      - name: Build the site
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail

          # -W turns every warning into an error and --keep-going reports all
          # of them instead of stopping at the first.  -n is nitpicky mode,
          # which is what makes an unresolvable cross-reference a warning;
          # conf.py sets ``nitpicky`` too, so passing the flag keeps the check
          # from depending on that setting staying put.
          sphinx-build -W --keep-going -n -b html doc/source doc/build/html

      # Two different questions; see the Development section of the site.
      # ``-b coverage`` asks whether every object of every module of the
      # package reaches a page, and writes them to python.txt.  ``interrogate``
      # asks whether every public object has a docstring, and ratchets on the
      # fail-under percentage recorded in pyproject.toml.
      #
      # ``-q`` is load-bearing, not tidiness: sphinx.ext.coverage logs an
      # undocumented object at info level unless the app is quiet, in which
      # case it logs a warning -- and only then does ``-W`` fail the job.
      - name: Docstring and API coverage
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail

          sphinx-build -q -W --keep-going -b coverage doc/source doc/build/coverage
          interrogate -v volumential | tee doc/build/coverage/interrogate.txt

      # Last, because it is the only step here whose outcome depends on hosts
      # nobody in this repository controls: a rate-limited or unreachable
      # third party must not stop the deterministic checks above from being
      # reported.
      - name: Check external links
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail

          # The linkcheck builder exits non-zero on a broken link by itself,
          # so -W would add nothing here.  The few URLs that cannot be checked
          # from a runner are listed, with a reason each, in
          # ``linkcheck_ignore`` of doc/source/conf.py; keep that list short
          # and justified rather than muting a real 404.
          sphinx-build -b linkcheck doc/source doc/build/linkcheck

      # A preview of the site this pull request would publish.  Download it
      # from the run's Artifacts section and open index.html; the pages are
      # built with the same command the Pages deployment uses, so what is in
      # here is what would go live.
      - name: Upload the built site
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docs-html-${{ github.run_id }}-${{ github.run_attempt }}
          path: doc/build/html/
          if-no-files-found: warn
          # A review aid, not an archive.
          retention-days: 14

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docs-coverage-${{ github.run_id }}-${{ github.run_attempt }}
          path: doc/build/coverage/
          if-no-files-found: warn

  pytest:
    name: Testing (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: mamba-org/setup-micromamba@f457c30a868e4760d3a6fcea5f25dc655b8edf39 # v3.2.1
        with:
          environment-file: .test-conda-env-py3.yml
          environment-name: testing
          cache-downloads: true
          generate-run-shell: true
      - name: Prepare Test Environment
        shell: micromamba-shell {0}
        run: |
          set -euxo pipefail

          export PY_EXE=python

          python -m pip install --upgrade pip
          python -m pip install uv

          # pyproject.toml pins each Git dependency to a commit, as a direct
          # reference, so this installs the commits uv.lock records, and those
          # are what this job tests.  ``uv pip install`` does not read the
          # lock; it does not need to, since the pins are in the package
          # metadata, where an install of a release finds them too.  The
          # ``Lock`` job checks that the lock and the pins agree.
          #
          # The ``fmmlib`` extra is what gives test_fmmlib_batched_stages.py
          # something to test: it asks for pyfmmlib 2026.1 or later, the first
          # release with the batched ``{l,h}{2,3}dformmp_imany`` wrappers and
          # the OpenMP feature option.  The conda environment already carries
          # conda-forge's build of it; anything older would be replaced by the
          # PyPI wheel.  Before 2026.1 this step built pyfmmlib from a Git
          # commit, with the Fortran compiler the environment then installed.
          uv pip install --system --editable ".[test,fmmlib]"

          python -V
          python -m pip --version

          # Fail the environment, not the tests, if the pyfmmlib that ended up
          # installed lacks the wrappers: the backend would fall back to the
          # per-box path silently (see DEVELOPMENT.md).
          python -c "from pyfmmlib import \
              h2dformmp_imany, h3dformmp_imany, l2dformmp_imany, l3dformmp_imany"

      - name: Run pytest suite (guarded)
        shell: micromamba-shell {0}
        run: |
          set -euxo pipefail

          export PY_EXE=python
          export PYTHONFAULTHANDLER=1
          export PYTEST_FLAGS="-vv -o faulthandler_timeout=300"
          # ci-support knows two schemes: "xdist" (or empty), which passes
          # ``-n 4`` (``-n $CISUPPORT_PYTEST_NRUNNERS`` when that is set), and
          # "no".  Anything else -- "yes" was here until #194 -- only prints
          # "unrecognized scheme" and runs the suite in one process.
          export CISUPPORT_PARALLEL_PYTEST=xdist
          export VOLUMENTIAL_LEVEL_RESTRICTION_MAX_PAIR_CHECKS=20000000
          export VOLUMENTIAL_LEVEL_RESTRICTION_MAX_NBOXES=500000
          export VOLUMENTIAL_LEVEL_RESTRICTION_MAX_LEAF_PAIR_TOTAL=50000000000

          curl -L -O https://tiker.net/ci-support-v0

          set +e
          timeout --signal=SIGINT --kill-after=120 900 bash -c 'source ./ci-support-v0; test_py_project' \
            2>&1 | tee linux-pytest.log
          test_status=${PIPESTATUS[0]}
          set -e

          if [ "$test_status" -eq 124 ]; then
            echo "::error::Linux pytest wrapper timed out after 900s"
          fi

          exit "$test_status"

      - name: Upload Linux diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: testing-linux-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            linux-pytest.log
            pytest.xml
          if-no-files-found: warn

  examples_smoke:
    name: Examples (Smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: mamba-org/setup-micromamba@f457c30a868e4760d3a6fcea5f25dc655b8edf39 # v3.2.1
        with:
          environment-file: .test-conda-env-py3.yml
          environment-name: testing
          cache-downloads: true
          generate-run-shell: true
      - name: Main Script
        shell: micromamba-shell {0}
        run: |
          # Load-bearing: the shell setup-micromamba generates does not pass
          # -e, so without this only the *last* command below decides the
          # job's outcome and a failing example is reported green (#151).
          set -euo pipefail

          export PY_EXE=python
          export VOLUMENTIAL_EXAMPLE_SMOKE=1
          export PYOPENCL_CTX="portable:0"

          python -m pip install --upgrade pip
          python -m pip install uv
          uv pip install --system --editable ".[test]"

          # laplace2d.py and laplace2d_adaptive.py run through the gallery
          # renderer, so the smoke job also exercises their figure output;
          # matplotlib comes from the conda environment file.
          python doc/tools/render_gallery.py laplace2d \
            --output-dir build/gallery \
            --pyopencl-ctx "$PYOPENCL_CTX"
          python doc/tools/render_gallery.py laplace2d-adaptive \
            --output-dir build/gallery \
            --pyopencl-ctx "$PYOPENCL_CTX"
          python examples/helmholtz2d.py
          python examples/helmholtz3d.py

      - name: Upload Laplace gallery preview
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gallery-laplace2d-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/gallery/
          # A failure before the renderer wrote anything leaves nothing to
          # upload; that is reported by the failing step, not a second error.
          if-no-files-found: warn
          retention-days: 14

# vim: sw=2
