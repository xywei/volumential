# Ruff configuration for Volumential.
#
# This file is the single source of truth for lint conventions; it replaces the
# former ``[flake8]``/``[isort]``/``[pycodestyle]`` sections of ``setup.cfg``.
#
# The rule set below is what the project wants long term.  Because the tree
# predates it, the ``[lint.per-file-ignores]`` block at the bottom is a
# *baseline*: a per-file record of the rules a file still violates.  New files
# start clean, existing files can be cleaned incrementally, and CI can run this
# config today instead of the four-rule smoke check.  Removing a baseline entry
# once a file is clean is the intended workflow.  The block is re-measured, not
# hand-edited: it is exactly the set of rules each file still trips with
# ``[lint.per-file-ignores]`` emptied, so entries appear and disappear as the
# tree changes.
#
# ``ruff format`` is deliberately *not* adopted as a gate: it would reformat 92
# of 117 files (~5.7k changed lines), and enabling flake8-quotes (``Q``) would
# rewrite 448 single-quoted literals.  Either one is a tree-wide rewrite that
# collides with every open branch, so the ``[format]`` section below only
# records the intended style for a future coordinated reformat.

line-length = 85
target-version = "py311"

extend-exclude = [
    ".venv",
    "build",
    "doc/build",
    # Generated by ``conf.py`` at the start of every documentation build: a
    # copy of ``examples/*.ipynb``, which is linted at its real path.
    "doc/source/examples/notebooks",
]

[lint]
# E,W  pycodestyle             F     pyflakes
# I    isort                   UP    pyupgrade
# B    flake8-bugbear          SIM   flake8-simplify
# C4   flake8-comprehensions   PIE   flake8-pie
# RUF  ruff-specific           PL    pylint (subset, see the ignore list)
# N    pep8-naming
#
# ``N`` costs nothing here: the only naming complaints in the tree are the 28
# ``N806`` sites in ``function_extension.py``, where capitalised names track the
# layer-potential notation of the paper and already carry ``# noqa: N806``.
# Selecting ``N`` is what makes those directives meaningful; without it they are
# unused-``noqa`` (``RUF100``) hits instead.
select = [
    "B",
    "C4",
    "E",
    "F",
    "I",
    "N",
    "PIE",
    "PL",
    "RUF",
    "SIM",
    "UP",
    "W",
]

ignore = [
    # Heavy dependencies (pyopencl, loopy, sumpy, pyfmmlib) are imported inside
    # functions on purpose, so that ``import volumential`` stays cheap and
    # optional backends stay optional.
    "PLC0415",
    # Complexity and arity metrics: numerical kernels legitimately take many
    # parameters and compare against dimension/order literals.  Chasing these
    # produces cosmetic churn rather than clarity.
    "PLR0911",
    "PLR0912",
    "PLR0913",
    "PLR0915",
    "PLR2004",
]

[lint.isort]
# Migrated from the former ``[isort]`` section of setup.cfg.  ``multi_line_output
# = 4`` has no ruff equivalent (ruff always emits vertical-hanging-indent), and
# ``line_length`` is the global ``line-length`` above.
known-first-party = [
    "boxtree",
    "loopy",
    "meshmode",
    "modepy",
    "pymbolic",
    "pyopencl",
    "pytential",
    "pytools",
    "sumpy",
]
known-local-folder = ["volumential"]
lines-after-imports = 2
combine-as-imports = true

[format]
# Recorded intent only; see the note at the top of this file.
quote-style = "double"
indent-style = "space"
line-ending = "lf"

